<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact - MonSite</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav>

        <div class="logo">
            MonSite
        </div>

        <button id="menuBouton" class="menu-bouton">
            ☰
        </button>

        <ul id="menu" class="menu">

            <li>
                <a href="index.html">Accueil</a>
            </li>

            <li>
                <a href="apropos.html">À propos</a>
            </li>

            <li>
                <a href="projets.html">Projets</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

        </ul>

    </nav>

</header>


<main>

    <section>

        <h1>Contactez-moi</h1>

        <form id="contactForm">

            <input
                type="text"
                id="nom"
                placeholder="Votre nom"
            >

            <input
                type="email"
                id="email"
                placeholder="Votre email"
            >

            <textarea
                id="messageContact"
                placeholder="Votre message"
            ></textarea>

            <button type="submit">
                Envoyer
            </button>

        </form>

        <p id="resultat"></p>

    </section>

</main>


<footer>

    <p>
        © 2026 MonSite
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
